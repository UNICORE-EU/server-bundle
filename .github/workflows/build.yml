name: Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: 17
    - name: Build bundle
      run: ant clean update dist
    - name: Setup integration test
      uses: actions/setup-python@v7
      with:
        python-version: '3.10'
    - name: Run integration test
      run: |
        python -m pip install --upgrade pyunicore
        ant launch-dist
        unicore info -v -c /tmp/ucc.config
        unicore rest -v -c /tmp/ucc.config get https://localhost:18080/DEMO-SITE/rest/core
        unicore rest -v -c /tmp/ucc.config get https://localhost:18080/WORKFLOW/rest/workflows
        unicore exec -v -c /tmp/ucc.config --sitename DEMO-SITE id
    - uses: actions/upload-artifact@v4
      with:
        name: server-bundle
        path: build/unicore-servers-*.tgz
